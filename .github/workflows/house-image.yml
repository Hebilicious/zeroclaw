# The image the house's Pi runs (Hebilicious/pi-talos, cluster/agents/zeroclaw/): this branch's
# changes on top of upstream, built natively for arm64 and pushed to
# ghcr.io/hebilicious/zeroclaw:house-agent (and :house-agent-<commit>).
name: House image

on:
  push:
    branches: [house-agent]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: house-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      # The final fat-LTO link exhausts the runner's memory (ResourceExhausted): bounded swap and one
      # BuildKit step at a time, as upstream's docker-publish.yml does.
      - name: Prepare bounded build memory
        id: dist_memory
        timeout-minutes: 5
        run: bash scripts/ci/dist_runner_memory.sh prepare
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          target: release
          # The Dockerfile's default features, plus observability-otel: the house exports its agents'
          # telemetry over OTLP (the default build has only the Prometheus backend).
          build-args: |
            ZEROCLAW_CARGO_FLAGS=--no-default-features --features acp-bridge,agent-runtime,channel-acp-server,channel-discord,channel-email,channel-filesystem,channel-git,channel-lark,channel-matrix,channel-telegram,channel-webhook,gateway,observability-otel,observability-prometheus,plugins-wasm-cranelift,schema-export,tool-claude-code,tool-claude-code-runner,tool-codex-cli,tool-composio,tool-gemini-cli,tool-google-workspace,tool-jira,tool-linkedin,tool-microsoft365,tool-notion,tool-opencode-cli,tool-project-intel,tools-external,whatsapp-web
          push: true
          tags: |
            ghcr.io/hebilicious/zeroclaw:house-agent
            ghcr.io/hebilicious/zeroclaw:house-agent-${{ github.sha }}
          cache-from: type=gha,scope=house-image
          cache-to: type=gha,mode=max,scope=house-image
      - name: Release the build memory
        if: always() && steps.dist_memory.outcome == 'success'
        env:
          ZC_DIST_SWAP_FILE: ${{ steps.dist_memory.outputs.swap_file }}
          ZC_DIST_SWAP_IDENTITY: ${{ steps.dist_memory.outputs.swap_identity }}
        run: bash scripts/ci/dist_runner_memory.sh cleanup
