# The image the house's Pi runs (Hebilicious/pi-talos, cluster/agents/zeroclaw/): this branch's
# changes on top of upstream, built natively for arm64 and pushed to
# ghcr.io/hebilicious/zeroclaw:house-agent (and :house-agent-<commit>).
#
# Built for turnaround: the Dockerfile's Cargo caches (registry, git, target) are carried from one
# run to the next, the release profile skips cross-crate LTO, and only the features the house uses
# are compiled, so a small change recompiles what it touched instead of the whole tree.
name: House image

on:
  push:
    branches: [house-agent]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: house-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      # Bounded swap and one BuildKit step at a time, as upstream's docker-publish.yml does: a full
      # release link can exhaust the runner's memory (ResourceExhausted).
      - name: Prepare bounded build memory
        id: dist_memory
        timeout-minutes: 5
        run: bash scripts/ci/dist_runner_memory.sh prepare
      - uses: docker/setup-buildx-action@v3
        id: buildx
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1
      # The Dockerfile's cache mounts live in the builder, which goes with the runner: restore them
      # from the Actions cache (the newest run's, by prefix) and save this run's after the build.
      # The cache map's keys are the directories themselves (cache-dir applies only when the map is
      # discovered from the Dockerfile), so each sits under cargo-cache/, the path the cache saves.
      - name: Restore the Cargo caches
        id: cargo_cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: cargo-cache
          key: house-cargo-${{ github.sha }}
          restore-keys: house-cargo-
      # The extraction after the build renames each cache into place, which needs the parent to exist.
      - name: Make the Cargo cache directory
        run: mkdir -p cargo-cache
      - name: Put the Cargo caches into the builder
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "cargo-cache/registry": { "target": "/usr/local/cargo/registry", "id": "zeroclaw-cargo-registry" },
              "cargo-cache/git": { "target": "/usr/local/cargo/git", "id": "zeroclaw-cargo-git" },
              "cargo-cache/target": { "target": "/app/target", "id": "zeroclaw-target" },
              "cargo-cache/web-target": { "target": "/app/target", "id": "zeroclaw-web-target" }
            }
          skip-extraction: ${{ steps.cargo_cache.outputs.cache-hit }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          target: release
          # Only what the house runs: the agent runtime and gateway (its webhook and OpenAI-compatible
          # API), ACP, the config schema, both observability backends (Prometheus metrics, OTLP to
          # the house's collector), and tools-external, which carries web_search_tool (the agents'
          # web search). Its config uses no chat channel, plugin or SaaS/CLI tool, so those
          # are left out. Release without cross-crate LTO and with parallel codegen: a larger binary,
          # built in a fraction of the time.
          build-args: |
            ZEROCLAW_CARGO_FLAGS=--no-default-features --features acp-bridge,agent-runtime,channel-acp-server,channel-webhook,gateway,observability-otel,observability-prometheus,schema-export,tools-external
            CARGO_PROFILE_RELEASE_LTO=false
            CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
          push: true
          tags: |
            ghcr.io/hebilicious/zeroclaw:house-agent
            ghcr.io/hebilicious/zeroclaw:house-agent-${{ github.sha }}
          cache-from: type=gha,scope=house-image
          cache-to: type=gha,mode=max,scope=house-image
      - name: Release the build memory
        if: always() && steps.dist_memory.outcome == 'success'
        env:
          ZC_DIST_SWAP_FILE: ${{ steps.dist_memory.outputs.swap_file }}
          ZC_DIST_SWAP_IDENTITY: ${{ steps.dist_memory.outputs.swap_identity }}
        run: bash scripts/ci/dist_runner_memory.sh cleanup
