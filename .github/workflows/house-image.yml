# The image the house's Pi runs (Hebilicious/pi-talos, cluster/agents/zeroclaw/): this branch's
# changes on top of upstream, built natively for arm64 and pushed to
# ghcr.io/hebilicious/zeroclaw:house-agent (and :house-agent-<commit>).
name: House image

on:
  push:
    branches: [house-agent]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: house-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          target: release
          push: true
          tags: |
            ghcr.io/hebilicious/zeroclaw:house-agent
            ghcr.io/hebilicious/zeroclaw:house-agent-${{ github.sha }}
          cache-from: type=gha,scope=house-image
          cache-to: type=gha,mode=max,scope=house-image
